<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>future CRM · Übersicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="uebersicht">

  <aside class="side" id="sidebar"></aside>
<div class="main">
  <header class="topbar">
    <h1>Übersicht<small>Standort Leipzig · Stand 05.06.2026</small></h1>
    <div class="spacer"></div>  
    <div class="actions"> 
      <button class="icon-btn"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
    </div>
  </header>   

  <div class="content">
    
    <!-- KPI ROW: Teilnehmer + Unternehmen -->  
    <section class="kpis">  
      <div class="kpi b">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div class="num" id="kpi-total">0</div>
        <div class="lbl">Teilnehmer in Betreuung</div>
      </div>
      <div class="kpi g">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></div>
        <div class="num" id="kpi-prakt">0</div>
        <div class="lbl">Im Praktikum</div>
      </div>
      <div class="kpi a">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-3"/></svg></div>
        <div class="num" id="kpi-un">0</div>
        <div class="lbl">Unternehmen aktiv</div>
      </div>
      <div class="kpi r" style="--k:var(--green)">
        <div class="ic" style="background:var(--green-soft);color:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div class="num" id="kpi-frei">0</div>
        <div class="lbl">Praktikumsplätze frei</div>
      </div>
      </section>

    <!-- Aktuelle Aktivitäten -->
    <section class="panel actpanel">
      <div class="panel-head">
        <h2>Aktuelle Aktivitäten</h2>
        <span class="count" id="act-count">0</span>
        <span style="margin-left:auto;font-size:12px;color:var(--ink-faint);font-weight:600">wer hat was wann gemacht</span>
      </div>
      <div class="activity" id="activity"></div>
    </section>

    <!-- Zwei Kurzübersichten: Teilnehmer + Unternehmen -->
    <section class="ov-grid">
      <div class="panel">
        <div class="panel-head">
          <h2>Teilnehmer</h2>
          <span class="count">Prio &amp; Risiko zuerst</span>
          <a class="sum-link" href="teilnehmer.html">Alle Teilnehmer
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        </div>
        <div class="sum-list" id="tn-summary"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Unternehmen</h2>
          <span class="count">freie Plätze zuerst</span>
          <a class="sum-link" href="unternehmen.html">Alle Unternehmen  
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        </div>
        <div class="sum-list" id="un-summary"></div>
      </div>

    </section>  

  </div>
</div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="layout.js"></script>
<script src="overview.js"></script>
</body>
</html>
